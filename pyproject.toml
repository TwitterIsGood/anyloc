[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anyloc"
version = "0.1.0"
description = "Local iOS location controller with a no-root Native/DVT backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymobiledevice3>=11.49.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "typer>=0.12",
]

[project.scripts]
anyloc = "anyloc.cli:app"

[tool.setuptools.packages.find]
include = ["anyloc*"]

[tool.setuptools.package-data]
anyloc = ["web/*"]
