name: Publish existing build

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "已生成两个架构 DMG 的 macOS 构建运行 ID"
        required: true
        type: string
      release_tag:
        description: "发布标签，例如 v0.1.0"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate build source
        id: source
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > run.json
          test "$(jq -r .path run.json)" = ".github/workflows/macos.yml"
          sha="$(jq -r .head_sha run.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          gh api "repos/$GH_REPO/contents/packaging/release-notes.md?ref=$sha" \
            --jq .content | base64 --decode > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          pattern: AnyLoc-macOS-*
          path: release-assets
          merge-multiple: true
      - name: Verify both installers
        working-directory: release-assets
        run: |
          for arch in arm64 x86_64; do
            test -s "AnyLoc-macOS-${RELEASE_TAG#v}-$arch.dmg"
            test -s "AnyLoc-macOS-${RELEASE_TAG#v}-$arch.dmg.sha256"
          done
          sha256sum -c *.sha256
      - name: Publish verified build
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "$SOURCE_SHA" \
              --title "AnyLoc $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
