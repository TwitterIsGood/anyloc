name: macOS Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布版本（如 v0.1.0）；留空只构建"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event_name }}-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Install Python and build dependencies
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          uv python install 3.12
          uv venv --managed-python --python 3.12 .venv
          uv pip install --python .venv/bin/python -e . -r packaging/requirements-build.txt
      - name: Set version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          .venv/bin/python - <<'PY'
          import os, re, tomllib
          tag = os.environ.get("RELEASE_TAG", "")
          if os.environ["GITHUB_REF"].startswith("refs/tags/"):
              tag = os.environ["GITHUB_REF_NAME"]
          if tag:
              if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
                  raise SystemExit("Release tag must be vMAJOR.MINOR.PATCH")
              version = tag[1:]
          else:
              with open("pyproject.toml", "rb") as f:
                  version = tomllib.load(f)["project"]["version"]
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"ANYLOC_VERSION={version}\n")
          PY
      - name: Build and verify app and DMG
        run: zsh packaging/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AnyLoc-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: AnyLoc-macOS-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums
        working-directory: release-assets
        run: sha256sum -c *.sha256
      - name: Publish DMGs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "AnyLoc $tag" --notes-file packaging/release-notes.md
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --latest
